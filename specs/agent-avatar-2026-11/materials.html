<!doctype html>
<html lang="en" data-zx-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Agent avatar materials — internal study</title>
  <link rel="stylesheet" href="../../styles/zx.css">
  <link rel="stylesheet" href="prototype.css">
  <link rel="stylesheet" href="materials.css">
</head>
<body>
  <!-- Internal exploration page. Served from the repository only (specs/ is never published). -->
  <header class="p-head">
    <div>
      <h1>Agent avatars — body materials</h1>
      <p>The shipped AgentAvatar geometry (<code>agentTraits()</code> + <code>agentFace()</code>) drawn with
        different body materials. Every colour is derived from tier-2 tokens: the tone's solid fill mixed
        with <code>--zx-color-agent-eye</code> (white) or <code>--zx-color-agent-pupil</code> (near black).</p>
    </div>
    <form class="p-controls" id="controls">
      <label>Theme
        <select name="theme"><option value="light">Light</option><option value="dark">Dark</option></select>
      </label>
      <label>Activity
        <select name="activity">
          <option value="idle">Idle</option><option value="thinking">Thinking</option>
          <option value="working">Working</option><option value="needs-you">Needs you</option>
          <option value="blocked">Blocked</option><option value="offline">Offline</option>
        </select>
      </label>
      <label>Jump to <select name="jump" id="jump"></select></label>
    </form>
  </header>
  <main id="materials"></main>
  <script type="module" src="materials.js"></script>
</body>
</html>
