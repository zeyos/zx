<!doctype html>
<html lang="en" data-zx-theme="light" data-zx-density="cozy">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Xenon theme studio — every component family on one page, under a standard theme or one you build yourself.">
    <title>Theming — ZeyOS Xenon Design System</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../styles/zx.css">
    <link rel="stylesheet" href="site.css">
    <link rel="stylesheet" href="theme.css">
    <script src="site.js"></script>
  </head>
  <body class="zx-scope site-page site-page--studio">
    <header class="site-header">
      <div class="site-header__inner">
        <a class="site-brand" href="index.html" aria-label="Zx home">
          <img class="brand-logo--light" src="assets/zx-logo.svg" alt="Zx">
          <img class="brand-logo--dark" src="assets/zx-logo-dark.svg" alt="Zx">
        </a>
        <a class="site-version" href="https://github.com/zeyos/zx/releases/latest"
          rel="noopener" title="Release notes">v<span data-site-version>4.3.1</span></a>
        <div class="site-docs-search theme-global-search">
          <form data-theme-search-field></form>
        </div>
        <nav class="site-nav" aria-label="Primary">
          <a href="docs.html">Documentation</a>
          <a href="docs.html#layouts">Layouts</a>
          <a href="theme.html">Theming</a>
        </nav>
        <div class="site-actions">
          <a class="site-icon-btn" data-site-icon="github" href="https://github.com/zeyos/zx" rel="noopener"
            title="Repository" aria-label="Zx on GitHub"></a>
          <button class="site-icon-btn" type="button" data-theme-toggle
            aria-label="Switch theme"></button>
        </div>
      </div>
    </header>

    <div id="theme-app">
      <p class="loading-copy">Loading the theme studio…</p>
    </div>
    <noscript>The theme studio runs the real components against live tokens, so it requires JavaScript.</noscript>

    <script type="module" src="theme.js"></script>

    <footer class="site-footer">
      <nav class="site-footer__legal" aria-label="Legal">
        <a href="https://www.zeyos.com/impressum/" rel="noopener">Imprint</a>
        <a href="https://www.zeyos.com/privacy/" rel="noopener">Privacy Policy</a>
        <a href="llms.txt">LLMs.txt</a>
      </nav>
    </footer>
  </body>
</html>
