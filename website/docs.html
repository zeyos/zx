    <template
      data-guide="introduction"
      data-title="Introduction"
      data-blurb="Xenon is a dependency-free design system; Zx implements its accessible components as plain ES modules.">
      <h2>What Xenon and Zx are</h2>
      <p>
        Xenon is a design system for browser applications: foundations, components, workflow
        patterns, and application layouts for dense data screens, long forms, and focused tasks.
        Zx is its implementation. It ships as plain ES2022 modules with <strong>no runtime
        dependencies</strong> — no framework or bundler required. The same source you read here
        runs unchanged in the browser. Xenon was developed at ZeyOS, but its public contracts are
        product- and framework-agnostic.
      </p>
      <p>
        Everything is built on native platform features: <code>&lt;dialog&gt;</code>, the popover
        attribute, <code>ElementInternals</code>, <code>:has()</code>, and CSS custom properties.
        Components follow the WAI-ARIA Authoring Practices patterns, so keyboard support and screen
        reader semantics come from the pattern rather than from bolted-on attributes.
      </p>

      <h2>Optional integration requirements</h2>
      <p>
        Zx has no package runtime dependencies and its source modules import no external runtime packages.
        <code>Chart</code> requires an injected renderer; the only supplied renderer,
        <code>ChartJsAdapter</code>, requires host-provided Chart.js 4. There is no built-in chart renderer.
        The website pins Chart.js 4.5.1 as a development dependency and copies it to self-hosted vendor
        assets during its build; Zx does not bundle it.
      </p>
      <p>
        Core icons use bundled SVG by default. Font Awesome opt-in requires host-loaded CSS or a kit.
        ZeyOS <code>moduleIcon()</code>, <code>moduleChip()</code>, and <code>zeyosAppIcon()</code>
        default to the external custom ZeyOS Font Awesome kit; <code>standard: true</code> still needs
        stock Font Awesome assets. <code>ZeyOS.connect()</code> requires an injected compatible client;
        it does not import the client package.
      </p>

      <h2>How this documentation is organised</h2>
      <ul>
        <li><strong>Getting started</strong> — installation, the mental model, theming, and how to
          talk to ZeyOS.</li>
        <li><strong>Components</strong> — every component with a live demo, its complete JavaScript
          source, and the API reference. It also covers the general-purpose
          <a href="#components/helpers">helper functions</a>.</li>
      </ul>
      <p>
        The <a href="layouts.html">layout gallery</a> puts the components to work: complete
        application templates — mail, an issue tracker, a knowledge base, invoicing, a CRM, and
        more — and the screen patterns inside them, each running live with its full source, down
        to a real ZeyOS invoices screen driven by a live schema.
      </p>

      <div class="docs-callout">
        <p>
          Building with an AI agent? <a href="llms.txt">llms.txt</a> is the machine-readable index,
          and <a href="../docs/llms.md">docs/llms.md</a> is the full agent reference — the same text
          the <strong>Reference</strong> tab shows for each component.
        </p>
      </div>

      <h2>Browser support</h2>
      <p>
        Evergreen browsers from roughly 2023 onwards: Chrome and Edge 114+, Firefox 121+, Safari
        17+. There is no transpilation step and no polyfill bundle.
      </p>
    </template>

    <template
      data-guide="installation"
      data-title="Installation"
      data-blurb="Add the stylesheet and the modules from npm or a public CDN — or drop the global bundle into a classic ZeyOS screen.">
      <h2>Bundles</h2>
      <p>
        <code>npm run build</code> writes four asset families in regular and minified form, plus
        generated declarations, to <code>dist/</code>. Pick the entry points that match the host:
      </p>
      <table>
        <thead>
          <tr><th>File</th><th>Format</th><th>Use it when</th></tr>
        </thead>
        <tbody>
          <tr>
            <td><code>zx.esm.js</code></td>
            <td>ES module</td>
            <td>The application uses <code>import</code> — the default choice.</td>
          </tr>
          <tr>
            <td><code>zx.global.js</code></td>
            <td>IIFE → <code>window.zx</code></td>
            <td>A classic screen with plain <code>&lt;script&gt;</code> tags.</td>
          </tr>
          <tr>
            <td><code>zx-zeyos.esm.js</code></td>
            <td>ES module</td>
            <td>The application uses the optional schema, module-icon, launcher, or entity bindings.</td>
          </tr>
          <tr>
            <td><code>zx.css</code></td>
            <td>Stylesheet</td>
            <td>Always. Load it once per document.</td>
          </tr>
        </tbody>
      </table>

      <h2>From a CDN</h2>
      <p>
        Every release published to npm is served by public CDNs such as jsDelivr and unpkg, with no
        download or build. One stylesheet and one script provide the standard components and bundled
        SVG icons. Chart rendering additionally needs an injected engine adapter; Font Awesome modes
        need their CSS or kit assets, and ZeyOS data operations need an application-provided client.
      </p>
      <table>
        <thead>
          <tr><th>Asset</th><th>jsDelivr URL</th></tr>
        </thead>
        <tbody>
          <tr>
            <td>Stylesheet</td>
            <td><code>https://cdn.jsdelivr.net/npm/@zeyos/zx@latest/dist/zx.min.css</code></td>
          </tr>
          <tr>
            <td>ES module</td>
            <td><code>https://cdn.jsdelivr.net/npm/@zeyos/zx@latest/dist/zx.esm.min.js</code></td>
          </tr>
          <tr>
            <td>Global script</td>
            <td><code>https://cdn.jsdelivr.net/npm/@zeyos/zx@latest/dist/zx.global.min.js</code></td>
          </tr>
          <tr>
            <td>ZeyOS binding</td>
            <td><code>https://cdn.jsdelivr.net/npm/@zeyos/zx@latest/dist/zx-zeyos.esm.min.js</code></td>
          </tr>
        </tbody>
      </table>
      <p>
        unpkg uses the same paths under <code>https://unpkg.com/@zeyos/zx@latest/</code>. Drop
        <code>.min</code> from a file name for the readable build.
      </p>
      <p>
        The part after <code>@</code> chooses the version. <code>@latest</code> always serves the
        newest release, including the next major version, and CDN caches can take a few hours to
        pick it up. <code>@5</code> follows every release of major version 5. An exact version such
        as <code>@5.1.0</code> never changes, which is the right choice for production and the only
        one that works with <code>integrity</code> hashes.
      </p>
      <pre data-code="cdn.html">
&lt;link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@zeyos/zx@latest/dist/zx.min.css"&gt;
&lt;script src="https://cdn.jsdelivr.net/npm/@zeyos/zx@latest/dist/zx.global.min.js"&gt;&lt;/script&gt;
&lt;script&gt;
  zx.Message.success('Zx is loaded');
&lt;/script&gt;
      </pre>

      <h2>CDN boilerplate with the ZeyOS client</h2>
      <p>
        A complete page that loads Zx, the zx-zeyos binding, and
        <a href="#getting-started/zeyos-data"><code>@zeyos/client</code></a> from the CDN and
        renders a server-paged invoice list. The import map lets the module code use the same
        package names as an npm project, so it moves into a bundled application unchanged.
      </p>
      <pre data-code="index.html">
&lt;!doctype html&gt;
&lt;html lang="en"&gt;
&lt;head&gt;
  &lt;meta charset="utf-8"&gt;
  &lt;meta name="viewport" content="width=device-width, initial-scale=1"&gt;
  &lt;title&gt;Invoices&lt;/title&gt;
  &lt;link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@zeyos/zx@latest/dist/zx.min.css"&gt;
  &lt;script type="importmap"&gt;
    {
      "imports": {
        "@zeyos/zx": "https://cdn.jsdelivr.net/npm/@zeyos/zx@latest/dist/zx.esm.min.js",
        "@zeyos/zx/zeyos": "https://cdn.jsdelivr.net/npm/@zeyos/zx@latest/dist/zx-zeyos.esm.min.js",
        "@zeyos/client": "https://cdn.jsdelivr.net/npm/@zeyos/client@latest/src/index.js"
      }
    }
  &lt;/script&gt;
&lt;/head&gt;
&lt;body class="zx-scope"&gt;
  &lt;main id="invoices"&gt;&lt;/main&gt;

  &lt;script type="module"&gt;
    import { createZeyosClient } from '@zeyos/client';
    import { connect, zeyosTable } from '@zeyos/zx/zeyos';

    const client = createZeyosClient({
      platform: 'https://cloud.zeyos.com/your-instance/',
      auth: { mode: 'session', session: { enabled: true, credentials: 'include' } }
    });
    connect(client, { locale: 'en-GB' });

    const list = zeyosTable(client, 'transactions', {
      fields: ['transactionnum', 'account', 'date', 'netamount', 'status'],
      pageSize: 25,
      sort: { id: 'date', dir: 'desc' },
      emptyText: 'No invoices yet'
    });

    document.querySelector('#invoices').append(list.table.toElement());
    await list.load();
  &lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;
      </pre>
      <p>
        Session authentication sends the ZeyOS session cookie, so serve the page from the ZeyOS
        instance itself or from an origin the instance allows. For anything else, use the OAuth
        modes described in the <code>@zeyos/client</code> documentation. Pin exact versions of both
        packages before the page goes to production.
      </p>

      <h2>ES modules</h2>
      <pre data-code="index.html">
&lt;link rel="stylesheet" href="/assets/zx.css"&gt;
&lt;body class="zx-scope"&gt;
  &lt;script type="module"&gt;
    import { Table, Message } from '/assets/zx.esm.js';

    const table = new Table('#records', {
      columns: [
        { id: 'number', label: 'Number', sortable: true, width: '1fr' },
        { id: 'customer', label: 'Customer', sortable: true, width: '2fr' }
      ],
      data: records,
      rowId: 'ID',
      sortMode: 'local',
      onrowclick: (event) =&gt; Message.info('Opening ' + event.detail.row.number)
    });
  &lt;/script&gt;
&lt;/body&gt;
      </pre>

      <h2>Global script</h2>
      <p>
        The global bundle exposes the identical API under <code>window.zx</code>, which is what
        classic ZeyOS screens use.
      </p>
      <pre data-code="legacy-screen.html">
&lt;link rel="stylesheet" href="/assets/zx.css"&gt;
&lt;script src="/assets/zx.global.js"&gt;&lt;/script&gt;
&lt;script&gt;
  var toggle = new zx.Toggle(null, { label: 'Notifications', checked: true });
  document.body.append(toggle.toElement());
&lt;/script&gt;
      </pre>

      <h2>The <code>zx-scope</code> class</h2>
      <p>
        Base typography, box sizing, and the default chrome for unstyled native controls live under
        <code>.zx-scope</code>. Put it on <code>&lt;body&gt;</code> — or on a single container when
        Zx has to coexist with another design system on the same page.
      </p>

      <h2>Running this site locally</h2>
      <pre data-code="terminal">
npm run serve   # http://127.0.0.1:8321/website/docs.html
npm test        # unit tests + design-token lint
npm run build   # dist/ bundles
      </pre>
      <p>
        No build step is required to develop: the server serves the source modules and the browser
        imports them directly.
      </p>

    <template
      data-guide="quick-start"
      data-title="Quick start"
      data-blurb="One constructor signature, one event convention, one teardown method — every component works the same way.">
      <h2>Constructing a component</h2>
      <p>
        Every component takes the same two arguments: a target and an options object.
      </p>
      <pre data-code="constructor.js">
new Component(target, options)
      </pre>
      <p><code>target</code> can be:</p>
      <ul>
        <li>an <strong>Element</strong> — the component takes it over and renders into it;</li>
        <li>a <strong>selector string</strong> — resolved with <code>querySelector</code>;</li>
        <li><strong><code>null</code></strong> — the component builds and owns its own root, which
          you retrieve with <code>.toElement()</code> and place yourself.</li>
      </ul>
      <pre data-code="quick-start.js">
import { Select, Message } from '/assets/zx.esm.js';

const select = new Select(null, {
  items: [
    { ID: 'open', name: 'Open' },
    { ID: 'paid', name: 'Paid' }
  ],
  value: 'open',
  filter: 'local',
  placeholder: 'Find a status'
});

document.querySelector('#status').append(select.toElement());
      </pre>

      <h2>Events</h2>
      <p>
        Subscribe with <code>.on(type, handler)</code>, or pass an <code>on&lt;type&gt;</code>
        option to the constructor. Handlers receive a <code>CustomEvent</code> whose
        <code>detail</code> is a plain object. Event names are lowercase and carry no
        <code>on</code> prefix.
      </p>
      <pre data-code="events.js">
select.on('change', (event) =&gt; {
  Message.success('Status: ' + event.detail.item.name);
});

// …identical to:
new Select(null, {
  onchange: (event) =&gt; Message.success('Status: ' + event.detail.item.name)
});
      </pre>
      <p>
        Each emit also dispatches a bubbling, composed <code>zx-&lt;type&gt;</code> event on the
        component's root element, so an ancestor can listen without holding the instance:
      </p>
      <pre data-code="delegated.js">
document.querySelector('#workspace').addEventListener('zx-change', (event) =&gt; {
  console.log(event.target, event.detail);
});
      </pre>

      <h2>Teardown</h2>
      <p>
        Call <code>.destroy()</code> when a screen closes. It aborts every listener the component
        registered and removes the nodes it created, leaving the DOM as it found it. Creating and
        destroying a component twice on the same target is safe.
      </p>
      <pre data-code="teardown.js">
select.destroy();
      </pre>

      <h2>Composing helpers</h2>
      <p>
        <code>h()</code> builds elements, <code>icon()</code> returns an inline SVG, and
        <code>button()</code> is a plain factory rather than a class. See
        <a href="#components/helpers">Helper functions</a> for the full surface.
      </p>
      <pre data-code="compose.js">
import { h, button, icon } from '/assets/zx.esm.js';

const toolbar = h('div', { class: 'toolbar' },
  button({ label: 'New invoice', kind: 'primary', icon: 'plus', onclick: create }),
  button({ label: 'Refresh', icon: 'reload', onclick: reload })
);
      </pre>
    </template>

    <template
      data-guide="locales"
      data-title="Locales"
      data-blurb="Choose languages, add translation catalogues and regional variants, and format messages, plurals, numbers and dates.">
      <h2>Try language switching</h2>

      <p>
        Switch between English, German, and a custom French catalogue. Edit the name and record
        to try positional and named variables; try counts 0, 1, 2, and 1200 to compare plural
        forms and number formatting. Your values stay in place when you change language.
      </p>
      <iframe class="docs-example__stage docs-guide-frame"
        src="./guides/locales.html" title="Live language switching example" data-guide-example
        data-example-sources="./guides/locales.js ./guides/locale-catalogues.js ./guides/locales.html ./guides/locales.css"></iframe>
      <p>
        The preview has its own language setting; the guide and editing controls stay in English.
        The translated Project field is recreated on each switch. Open <strong>Code</strong> to
        copy the running example and its catalogues, or
        <a href="./guides/locales.html" target="_blank" rel="noopener">open the example separately</a>.
      </p>

      <h2>Language, locale, and catalogue</h2>

      <p>
        Zx ships English and German interface messages. Other languages can be supplied by the application. Locale tags such as <code>en-GB</code>, <code>de-AT</code>, and <code>fr-CA</code> describe language and regional conventions; adding a tag to a picker does not install a translation.
      </p>

      <ul>
        <li><code>setTranslator(fn)</code> supplies the words. The function receives a flat message key and returns its text.</li>
        <li><code>setLanguage(tag)</code> selects the active language for plural rules, default formatting, and language-specific <code>msg</code> tables. It does not load a catalogue or change the page&#x27;s HTML <code>lang</code> attribute.</li>
        <li><code>locale</code> selects formatting on helpers and components that expose this option. It does not select translated interface messages.</li>
        <li><code>displayLocale</code> controls the names shown by Select.locale() and Select.country(), independently of their selected value.</li>
        <li><code>msg</code> overrides messages for one component. Application labels, record values, and server text remain application-owned.</li>
      </ul>

      <h2>Enable a shipped language</h2>

      <p>
        Install the catalogue and language before creating components:
      </p>

      <pre data-code="activate-german.js">
import { setLanguage, setTranslator } from '@zeyos/zx';
import { de } from '@zeyos/zx/locales/de.js';

setTranslator((key) =&gt; de[key]);
setLanguage('de-AT');
document.documentElement.lang = 'de-AT';
      </pre>

      <p>
        This uses German messages with Austrian formatting conventions. <code>setTranslator(null)</code> restores English message fallback; call <code>setLanguage(&#x27;en&#x27;)</code> as well to return formatting to English. <code>en</code> from <code>@zeyos/zx/locales/en.js</code> is the frozen <code>defaultMessages</code> object. The optional <code>@zeyos/zx/locales/index.js</code> exports <code>en</code>, <code>de</code>, and the frozen <code>locales</code> manifest. Importing that manifest includes both catalogues; the main entry does not load German automatically.
      </p>

      <h2>Add a new language</h2>

      <p>
        Create an application-owned module, for example <code>app/locales/fr.js</code>, served at <code>/app/locales/fr.js</code>. This intentionally partial example translates two Select messages:
      </p>

      <pre data-code="app/locales/fr.js">
export const fr = Object.freeze({
  'select.none': 'Aucune sélection',
  'select.empty': 'Aucun résultat'
});
      </pre>

      <pre data-code="activate-french.js">
import { setLanguage, setTranslator } from '@zeyos/zx';
import { fr } from '/app/locales/fr.js';

setTranslator((key) =&gt; fr[key]);
setLanguage('fr-FR');
document.documentElement.lang = 'fr-FR';
      </pre>

      <p>
        Use <code>defaultMessages</code> as the inventory of built-in keys to translate. Keep their placeholders, including each plural form&#x27;s placeholders, and test the controls and accessible labels that your application uses. A partial catalogue should return <code>undefined</code> for untranslated keys so Zx can apply its English fallback with English plural rules. Do not fill a partial non-English catalogue by spreading <code>defaultMessages</code> into it. <code>null</code> and an echoed key also mean “no translation”; an empty string is an intentional empty translation.
      </p>

      <p>
        Application catalogues need no change to Zx or its shipped manifest. Keep a registry of the languages your application actually supports, and pass those tags to Select.locale().
      </p>

      <h2>Regional variants and catalogue lookup</h2>

      <p>
        The application chooses how a regional tag maps to a catalogue. Zx does not automatically search <code>de-AT</code>, then <code>de</code>, inside your translator. Reuse a language catalogue, or create regional overrides:
      </p>

      <pre data-code="regional-locales.js">
import { setLanguage, setTranslator } from '@zeyos/zx';
import { en, de } from '@zeyos/zx/locales/index.js';

const deAT = Object.freeze({ ...de, 'table.empty': 'Keine Einträge' });
const catalogues = { en, de, 'de-AT': deAT };

function applyLocale(tag) {
  const locale = Intl.getCanonicalLocales(tag)[0];
  const language = new Intl.Locale(locale).language;
  const catalogue = catalogues[locale] ?? catalogues[language];
  setTranslator(catalogue ? (key) =&gt; catalogue[key] : null);
  setLanguage(locale);
  document.documentElement.lang = locale;
}

applyLocale('de-AT');
      </pre>

      <p>
        Here <code>en-GB</code> reuses English messages, while <code>de-AT</code> keeps its regional override. This function expects a valid BCP 47 tag; picker values are already canonical. General locale APIs use hyphenated tags.
      </p>

      <h2>Message keys and interpolation variables</h2>

      <p>
        Use flat string keys for your own messages. A dotted key is a name, not a nested object path. Positional placeholders are <code>%1</code>, <code>%2</code>, and so on; named placeholders use <code>%name%</code>:
      </p>

      <pre data-code="messages.js">
import { setLanguage, setTranslator, translate } from '@zeyos/zx';
import { de } from '@zeyos/zx/locales/de.js';

const messages = Object.freeze({
  ...de,
  'app.welcome': 'Willkommen, %1!',
  'app.assigned': '%person% bearbeitet %record%.'
});
setTranslator((key) =&gt; messages[key]);
setLanguage('de');

translate('app.welcome', ['Ada']);
translate('app.assigned', { person: 'Ada', record: 'INV-42' });
      </pre>

      <p>
        <code>component.msg(key, ...args)</code> takes positional arguments. For a named template, use <code>translate(key, values)</code> or <code>printf(component.msg(key), values)</code>. Interpolation produces plain text; render it with text nodes or <code>textContent</code>.
      </p>

      <p>
        For a single component, pass <code>msg: { &#x27;select.empty&#x27;: &#x27;Nothing found here&#x27; }</code>. Resolution is instance messages, host translator, inherited component messages, English catalogue, then the key. Language-specific tables such as <code>msg: { de: { &#x27;select.empty&#x27;: &#x27;Nichts gefunden&#x27; } }</code> match the exact active language identifier; provide a <code>de-AT</code> table or a flat entry when that is the active tag.
      </p>

      <h2>Plural forms</h2>

      <p>
        Pass a numeric count separately from its displayed text. The selected cardinal category comes from <code>Intl.PluralRules</code>; messages remain flat strings:
      </p>

      <pre data-code="plurals.js">
import { formatNumber, setLanguage, setTranslator, translatePlural } from '@zeyos/zx';
import { de } from '@zeyos/zx/locales/de.js';

const messages = Object.freeze({
  ...de,
  'app.results.one': '%1 Ergebnis',
  'app.results.other': '%1 Ergebnisse'
});
setTranslator((key) =&gt; messages[key]);
setLanguage('de');

const count = 1200;
translatePlural('app.results', count, [formatNumber(count)]);
      </pre>

      <p>
        Use <code>component.msgPlural(key, count, ...args)</code> inside a component. Supply <code>.other</code> and the categories your language needs: <code>.zero</code>, <code>.one</code>, <code>.two</code>, <code>.few</code>, and <code>.many</code> are supported too. At each message source, lookup tries the selected category, <code>.other</code>, then the unsuffixed key and any supported legacy alias before moving to the next source. Existing flat overrides therefore keep their precedence. English fallback uses English rules. Custom application keys need their own fallback text; they are not part of the built-in English catalogue. Ordinary <code>translate()</code> and <code>msg()</code> never infer a count.
      </p>

      <h2>Formatting and date-name overrides</h2>

      <p>
        Formatting uses a supported explicit locale, then the active language, then English. Support is checked for the particular Intl service, since a language may support numbers but not plural rules. Regional English tags retain their own conventions.
      </p>

      <pre data-code="formatting.js">
import { formatCurrency, formatDate, formatNumber } from '@zeyos/zx';

formatNumber(1234.5, { locale: 'en-GB', decimals: 2 });
formatCurrency(1234.5, 'EUR', { locale: 'de-AT' });
formatDate(new Date(2026, 8, 1), '%b', { locale: 'en-GB' });
      </pre>

      <p>
        Components with a <code>locale</code> option can use the same override. For NumberField, locale-aware display and parsing apply with <code>group: true</code>; ungrouped fields retain their machine-format input behavior. Currency, time zone, week start, and display patterns are separate settings where the API exposes them; a locale tag alone does not choose them all.
      </p>

      <p>
        <code>formatDate()</code> normally obtains month and weekday names from Intl. A host translator can override <code>date.month.0</code> through <code>date.month.11</code> and <code>date.weekday.0</code> through <code>date.weekday.6</code> (Sunday is zero). Use <code>date.month.short.0</code> and <code>date.weekday.short.0</code> for their short forms. Missing short names come from Intl, not a shortened translated long name. These overrides apply when no explicit locale is passed; an explicit <code>formatDate(..., { locale })</code> takes precedence. <code>locale: null</code> remains implicit.
      </p>

      <h2>Use the Select-based pickers</h2>

      <p>
        Select.locale() and Select.country() return ordinary Select instances. They keep its popup, keyboard map, events, field adapter, and <code>.zx-select</code> styling, adding item generation, names, flags, and value normalization. A locale selection emits <code>change</code>; it does not install translations or change the application language.
      </p>

      <p>
        Using <code>applyLocale()</code> from the regional-lookup example:
      </p>

      <pre data-code="language-picker.js">
import { getLanguage, Select } from '@zeyos/zx';

const picker = Select.locale(null, {
  locales: ['en-GB', 'de-DE', 'de-AT'],
  value: getLanguage(),
  displayLocale: 'en-GB',
  flags: 'code',
  filter: 'local'
});
picker.on('change', ({ detail }) =&gt; {
  if (detail.value) applyLocale(detail.value);
});
document.querySelector('#language').append(picker.toElement());
      </pre>

      <p>
        <code>displayLocale</code> changes the language names shown, while the selected value stays a locale tag. Select.locale() filters automatically for lists longer than seven; <code>filter: &#x27;local&#x27;</code> also enables search for short lists. For a form, use the existing Select field preset:
      </p>

      <pre data-code="language-field.js">
import { Field } from '@zeyos/zx';

const languageField = new Field(null, {
  type: 'zxselect',
  name: 'language',
  label: 'Language',
  value: 'de-AT',
  props: { preset: 'locale', locales: ['en-GB', 'de-AT'], flags: 'code' }
});
      </pre>

      <p>
        Use <code>props.preset: &#x27;country&#x27;</code> for the country factory. Preset names are Field adapter options; for direct construction call <code>Select.locale()</code> or <code>Select.country()</code>.
      </p>

      <h2>Switching language at runtime</h2>

      <p>
        Set the translator and active language together, then refresh your application UI. Zx does not broadcast a language-change event or automatically relabel every mounted component. Preserve the application&#x27;s values, destroy affected instances, and recreate them with the new messages; merely changing the picker value does not do this. Use each component&#x27;s documented update methods where they cover the text being changed, rather than calling its internal <code>render()</code> method.
      </p>

      <p>
        Set the document or region&#x27;s HTML <code>lang</code> for pronunciation, and set <code>dir=&quot;rtl&quot;</code> when your application selects a right-to-left language. Zx does not infer text direction from <code>setLanguage()</code>. Verify visible labels, accessible names, plural counts, date/number entry, and layout after a switch.
      </p>
    </template>

    <template
      data-guide="theming"
      data-title="Theming"
      data-blurb="Two attributes switch light/dark and the accent; spacing and geometry are tokens. A product theme is a short list of semantic token overrides.">
      <div class="docs-callout">
        <p>
          The <a href="theme.html">theme studio</a> puts every component family on one page under a live
          theme: cycle the standard presets, change the accent, spacing, radius, and type, and copy
          the result out as CSS. It is the fastest way to read the rest of this page.
        </p>
      </div>

      <h2>Switching theme</h2>
      <p>
        Set <code>data-zx-theme</code> (<code>light</code>, <code>dark</code>, <code>auto</code>) on
        any ancestor — usually <code>&lt;html&gt;</code>. It cascades, so a dark panel inside a
        light application is just another attribute.
      </p>
      <pre data-code="theme.html">
&lt;html data-zx-theme="dark"&gt;
      </pre>

      <h2>Overriding a colour once</h2>
      <p>
        Every colour role is declared once, on <code>:root</code>. A theme attribute only sets
        <code>color-scheme</code>, which picks the half of each <code>light-dark()</code> pair the
        region reads. So override a colour on <code>:root</code> as well — as
        <code>light-dark(&lt;light&gt;, &lt;dark&gt;)</code> where the two appearances differ, as a
        single value where they do not — and it reaches light, dark, and auto regions, nested ones
        included. Roles derived from it follow: hover, current, the glass and overlay surfaces, and
        the tone tints read <code>--zx-color-text</code> and <code>--zx-color-bg-surface</code>. A
        material exported from the theme studio works the same way.
      </p>
      <pre data-code="override.css">
:root {
  --zx-color-bg-page: light-dark(#f7f8fa, #14161b);
  --zx-color-text-muted: light-dark(#5b6170, #a3a9b6);
}
      </pre>
      <p>
        The accent is the exception, because it is a ramp rather than a role: set the five
        <code>--zx-accent-*</code> stops (below) and each appearance takes its own. A nested
        <code>data-zx-preset</code> region restates the roles that read the ramp — the accent
        family, the selected fill, the focus ring, and the overlay selection and images — so an
        override of one of those meant to reach such a region too is written
        <code>:root, [data-zx-preset] { … }</code>. Script that needs a colour reads it from an
        element's computed style rather than from the property's text, which may be a
        <code>light-dark()</code> pair. Browsers from before 2024 lack <code>light-dark()</code> and
        get per-theme tokens instead, where a <code>:root</code> override stops at a nested region;
        an application that supports them wraps its own <code>light-dark()</code> overrides in
        <code>@supports (color: light-dark(#000, #fff))</code>.
      </p>

      <h2>Spacing and geometry</h2>
      <p>
        Xenon has one geometry, and it is set by tokens rather than modes. Every spacing step is a
        multiple of <code>--zx-space-unit</code> (4px: steps of 4, 8, 12, 16, 20, 24, 32, and
        40px), every radius step is a fraction of <code>--zx-radius</code> (4px: 2, 3, 4, and 6px),
        and controls are <code>--zx-control-height</code> tall (30px). Change those three and
        padding, gaps, indents, corners, and rows all follow together — on the whole application,
        or on one region of it.
      </p>
      <pre data-code="geometry.css">
/* A tighter application: a smaller unit and shorter controls, type unchanged. */
:root {
  --zx-space-unit: 3.5px;
  --zx-control-height: 28px;
}
      </pre>
      <p>
        A data row — a table row, a single-line list row — is <code>--zx-row-height</code>, which
        follows the control height (36px at the default), so every list on a screen keeps one
        rhythm. Set it on its own only to make rows tighter or more relaxed than the controls. Type
        works the same way: <code>--zx-text-base</code> (14px) is the one size a theme sets, and
        every <code>--zx-text-*</code> step derives from it, so the hierarchy holds at any base.
      </p>

      <h2>Two registers: interface and reading</h2>
      <p>
        Controls, rows, and navigation are interface type. Authored content — a document, a
        record's notes, a message, an assistant's answer — is reading type, and it is a separate
        decision. Wrap it in <code>.zx-prose</code> and it reads <code>--zx-font-prose</code>,
        <code>--zx-prose-size</code>, <code>--zx-prose-leading</code>, and
        <code>--zx-prose-measure</code>, so a product can set its documents in a serif, a size
        larger, or a narrower column without touching a single control. The theme studio's
        Reading group sets all three.
      </p>
      <pre data-code="reading.css">
/* Documents in a serif, a little larger; the interface keeps its own typeface. */
:root {
  --zx-font-prose: Charter, "Bitstream Charter", "Sitka Text", Cambria, Georgia, serif;
  --zx-prose-size: 17px;
  --zx-prose-measure: 64ch;
}
      </pre>
      <p>
        Navigation recedes on its own: labels in a chrome column rest at
        <code>--zx-color-text-chrome</code>, one ink step under the content, and come up to the
        full text colour on hover and when current. Where a chrome column meets the canvas, the
        tone step separates them in light, and <code>--zx-color-border-chrome</code> draws a
        hairline only where tone cannot — in dark, under a request for more contrast, and in forced
        colours.
      </p>

      <h2>Surface hierarchy and Aurora</h2>
      <p>
        Xenon separates <strong>ambient light</strong> from <strong>material</strong>. Add one
        <a href="#components/aurora">Aurora</a> to an application canvas, then let semantic surface
        roles decide how much of that light shows through. Persistent chrome is translucent but
        calm; raised feature cards reveal a little more; menus and dialogs use the overlay tiers.
        Tables, forms, code, long lists, and docked work areas stay opaque for sustained reading.
      </p>
      <pre data-code="surfaces.js">
import { Aurora } from '/assets/zx.esm.js';

const light = new Aurora('#application-canvas', {
  preset: 'source',
  colors: ['#21cc75', '#2b7fff', '#9a67ff'],
  intensity: 'subtle'
});

// Components on the canvas consume the shared chrome, raised, and overlay material tokens.
// They never need their own Aurora instance.
      </pre>
      <p>
        The Theme Studio's <strong>Material</strong> changes the response of those surfaces without
        changing Aurora itself: Glass (the default) is a thin pane lit on its edge, Deep glass a
        thick one with an inner glow and a fine grain, Frost milk glass that diffuses, Smoke tinted
        glass that darkens the scene, Paper, Satin and Enamel opaque surfaces (matte, brushed, glazed)
        that never blur, and Flat the plain semantic surfaces. Each is a set of token overrides built from six per-theme
        ingredients (the pane's rim, ring, lift, shade, edge, and tint), so one recipe serves light
        and dark. Reduced-transparency and forced-colour modes suppress ambient illumination and
        return every material to an opaque semantic surface.
      </p>

      <h2>The standard themes</h2>
      <p>
        <code>data-zx-preset</code> is the second attribute, and it is orthogonal to the first:
        it picks the <strong>accent ramp</strong>, while <code>data-zx-theme</code> decides which
        end of that ramp each surface uses. Seven ship with the library:
      </p>
      <table>
        <thead><tr><th>Preset</th><th>Accent</th><th>For</th></tr></thead>
        <tbody>
          <tr><td><code>zx</code></td><td>ZeyOS green</td><td>The default. Set nothing to get it.</td></tr>
          <tr><td><code>zeyos</code></td><td>ZeyOS gold</td><td>Screens that sit inside the ZeyOS product marque.</td></tr>
          <tr><td><code>ocean</code></td><td>Blue</td><td>Tools meant to read as infrastructure.</td></tr>
          <tr><td><code>violet</code></td><td>Violet</td><td>The most saturated of the seven.</td></tr>
          <tr><td><code>rose</code></td><td>Rose</td><td>Warm and loud; check it against the danger colour.</td></tr>
          <tr><td><code>slate</code></td><td>Near-neutral</td><td>Data-heavy screens that should carry their own colour.</td></tr>
          <tr><td><code>folio</code></td><td>Ink blue</td><td>Calm, document-first products: a quiet accent beside long-form reading.</td></tr>
        </tbody>
      </table>
      <pre data-code="preset.html">
&lt;html data-zx-theme="dark" data-zx-preset="ocean"&gt;
      </pre>

      <h2>Defining your own accent</h2>
      <p>
        A preset is five tier-1 declarations — <code>--zx-accent-300</code> through
        <code>--zx-accent-700</code> — and nothing else. The semantic tier reads
        600 and 700 on light surfaces and 300, 400, and 500 on dark ones, so one block rethemes
        light, dark, and auto together, with no second list to keep in sync.
      </p>
      <pre data-code="accent.css">
[data-zx-preset="acme"] {
  --zx-accent-300: #c4b4ff;
  --zx-accent-400: #a684ff;
  --zx-accent-500: #8e51ff;
  --zx-accent-600: #7f22fe;
  --zx-accent-700: #7008e7;
}
      </pre>
      <p>
        Two stops carry a contract. <code>--zx-color-on-accent</code> is white on light surfaces and
        near-black on dark ones, and it is never restated per theme — which only works while
        <strong>600 clears 4.5:1 against white</strong> and <strong>400 clears 4.5:1 against the
        dark page</strong>. Every shipped preset does, and the studio reports the ratio for whatever
        you build. Status colours are deliberately not part of a preset: danger, warning, and
        success mean the same thing whatever the brand colour is.
      </p>

      <h2>The token tiers</h2>
      <p>
        Colours are defined once as a <strong>tier-1 palette</strong>
        (<code>--zx-gray-*</code>, <code>--zx-green-*</code>, …) and mapped to
        <strong>tier-2 semantic tokens</strong> that describe a role rather than a hue. Components —
        and application CSS — may only use the semantic tier. <code>tests/lint-tokens.js</code>
        enforces this, which is what makes retheming a one-file change.
      </p>
      <p>
        One tier-1 name is meant to be overridden: <code>--zx-accent-*</code>. It is an alias the
        accent roles resolve through, so a preset can repoint the brand colour without touching a
        single semantic mapping. Everything else in tier 1 stays private.
      </p>
      <table>
        <thead><tr><th>Token</th><th>Role</th></tr></thead>
        <tbody>
          <tr><td><code>--zx-color-bg-page</code></td><td>Application background</td></tr>
          <tr><td><code>--zx-color-bg-surface</code></td><td>Cards, panels, headers</td></tr>
          <tr><td><code>--zx-color-bg-raised</code></td><td>Menus, popovers, toolbars</td></tr>
          <tr><td><code>--zx-color-bg-muted</code></td><td>Inline code, table headers</td></tr>
          <tr><td><code>--zx-color-bg-hover</code></td><td>Hover and pressed fills</td></tr>
          <tr><td><code>--zx-color-bg-selected</code></td><td>Selected rows and items</td></tr>
          <tr><td><code>--zx-color-glass-chrome</code></td><td>Persistent navigation and application chrome</td></tr>
          <tr><td><code>--zx-color-glass-surface</code></td><td>Explicitly raised feature content</td></tr>
          <tr><td><code>--zx-color-overlay-surface</code></td><td>Compact menus, pickers, tooltips, and Toast</td></tr>
          <tr><td><code>--zx-color-overlay-panel</code></td><td>Launcher, Dialog, Modal, and overlay Sheet</td></tr>
          <tr><td><code>--zx-color-border</code></td><td>Structural separators</td></tr>
          <tr><td><code>--zx-color-border-control</code></td><td>Input and button outlines</td></tr>
          <tr><td><code>--zx-color-text</code> / <code>-muted</code></td><td>Body and secondary text</td></tr>
          <tr><td><code>--zx-color-accent</code></td><td>Primary actions and selection</td></tr>
          <tr><td><code>--zx-color-danger</code> / <code>-warning</code> / <code>-success</code> / <code>-info</code></td><td>Status colours, each with a matching <code>-bg</code></td></tr>
          <tr><td><code>--zx-control-height</code> / <code>-radius</code> / <code>-pad-x</code></td><td>Control geometry</td></tr>
          <tr><td><code>--zx-space-unit</code> / <code>--zx-space-1</code> … <code>-8</code></td><td>Spacing, as multiples of one unit</td></tr>
          <tr><td><code>--zx-radius</code> / <code>-sm</code> / <code>-md</code> / <code>-lg</code> / <code>-xl</code></td><td>Corner radius, as fractions of one base</td></tr>
          <tr><td><code>--zx-focus-ring</code></td><td>The <code>:focus-visible</code> box shadow</td></tr>
        </tbody>
      </table>
      <p>
        The <a href="#components/tokens">Design tokens</a> entry renders every one of them live, and
        the <a href="theme.html">theme studio</a> shows what changing them does to the whole library
        at once.
      </p>

      <h2>Defining a product theme</h2>
      <p>
        A product theme is an accent preset and a few semantic overrides, each declared once on
        <code>:root</code>. Nothing else changes — every component, in every theme and region,
        picks the new values up. Set <code>data-zx-preset="acme"</code> on
        <code>&lt;html&gt;</code> beside the theme.
      </p>
      <pre data-code="product-theme.css">
/* The accent: a ramp, as in "Defining your own accent" above. */
[data-zx-preset="acme"] {
  --zx-accent-300: #a9cfff;
  --zx-accent-400: #72b0fa;
  --zx-accent-500: #448bde;
  --zx-accent-600: #1c70c9;
  --zx-accent-700: #0058aa;
}

/* Everything else: roles, once, for both appearances. */
:root {
  --zx-color-bg-page: light-dark(#f7f8fa, #14161b);
  --zx-color-text: light-dark(#1d2129, #e3e6eb);
  --zx-radius: 3px;
}
      </pre>

      <h2>Restyling one component</h2>
      <p>
        Reach for the least specific override that works. A global semantic token first — it keeps
        the whole set coherent. Then one of the published component hooks, each of which falls back
        to the token it replaces, so setting none of them changes nothing:
      </p>
      <ul>
        <li><code>--zx-table-header-bg</code>, <code>--zx-table-row-hover-bg</code>,
          <code>--zx-table-row-selected-bg</code>, <code>--zx-table-border-color</code></li>
        <li><code>--zx-button-radius</code></li>
        <li><code>--zx-panel-header-bg</code></li>
      </ul>
      <p>
        An internal selector never. Component CSS declares many other
        <code>--zx-&lt;component&gt;-*</code> properties — those are internal geometry, not API, and
        they change without notice. The list above is deliberately short for the same reason: every
        hook published is a promise to keep.
      </p>

      <h2>Where the current theme comes from</h2>
      <p>
        The stock light and dark themes use a restrained neutral ramp, a 4px spacing unit, a 4px
        base radius, Inter, 30px controls, and a three-pixel translucent focus ring. The accent is the
        ZeyOS green, tuned across Xenon's emerald ramp so it stays legible on both surfaces.
      </p>

      <h2>Module accents</h2>
      <p>
        ZeyOS module colours ship as <code>--zx-module-*</code> tokens.
        <code>MasterPanel</code> and <code>NavigationBar</code> accept a <code>module</code> option
        (<code>billing</code>, <code>projects</code>, <code>tickets</code>, …) and colour their
        header accordingly. Entity and API resource names resolve too —
        <code>--zx-module-invoices</code> points at the billing-transaction colour.
      </p>
      <p>
        The tokens are generated from <code>src/zeyos/modules.js</code>, the configuration file
        that also names each module's icon in the ZeyOS Font Awesome kit. See
        <a href="#components/icons">Icons</a> for the module gallery and the chip renderer.
      </p>
    </template>

    <template
      data-guide="zeyos-data"
      data-title="Talking to ZeyOS"
      data-blurb="Use @zeyos/client for business data, and zx-zeyos to generate typed tables, forms, and pickers from its schema.">
      <h2>The client</h2>
      <p>
        Business data comes from the dedicated ZeyOS client library,
        <strong><code>@zeyos/client</code></strong>: a zero-dependency ESM OpenAPI client covering
        the whole ZeyOS surface. Zx does not wrap it, bundle it, or depend on it — you construct it
        and hand it in.
      </p>
      <pre data-code="client.js">
import { createZeyosClient } from '@zeyos/client';

const client = createZeyosClient({
  platform: 'https://cloud.zeyos.com/your-instance/',
  auth: { mode: 'session', session: { enabled: true, credentials: 'include' } }
});

const invoices = await client.api.listTransactions({ limit: 25 });
      </pre>
      <p>
        Note the ZeyOS naming: invoices live under <code>transactions</code> and customers under
        <code>accounts</code>. Client instances are frozen — never attach properties to them.
      </p>

      <h2>The zx-zeyos binding</h2>
      <p>
        <code>src/zeyos/</code> is an optional, injection-based layer between Zx and the client. It
        reads <code>client.schema</code> at runtime and generates fully typed UI: date fields become
        dateboxes, enums become selects, foreign keys become entity pickers.
      </p>
      <pre data-code="zeyos-binding.js">
import { zeyosTable, zeyosForm } from '/assets/zx-zeyos.esm.js';

const list = zeyosTable(client, 'transactions', {
  fields: ['transactionnum', 'account', 'date', 'netamount', 'status'],
  pageSize: 25,
  sort: { id: 'date', dir: 'desc' },
  onRowClick: (row) =&gt; openEditor(row.ID)
});

await list.load({ search: '', filters: {} });
document.querySelector('#invoices').append(list.table.toElement());
      </pre>
      <p>
        The binding ships as a separate <code>dist/zx-zeyos.esm.js</code> bundle and is never
        imported by <code>src/index.js</code>, so the core stays dependency-free. Query rules worth
        remembering: <code>filters</code> is plural, dates are Unix <em>seconds</em>, and
        <code>visibility: 0</code> is the default scope.
      </p>

      <h2>Ad-hoc calls</h2>
      <p>
        For in-app <code>remotecall</code>-style requests that are not part of the OpenAPI surface,
        Zx ships a minimal <code>Http</code> / <code>zeyosService</code> helper. For anything that
        maps to a ZeyOS resource, prefer <code>@zeyos/client</code>.
      </p>

      <div class="docs-callout">
        <p>
          The <a href="layouts.html#zeyos-invoices">ZeyOS invoices</a> layout is the reference integration: a
          complete invoices screen generated from the real <code>transactions</code> and
          <code>accounts</code> schemas, with server-side filtering, sorting, and paging.
        </p>
      </div>
    </template>

    <template
      data-guide="accessibility"
      data-title="Accessibility"
      data-blurb="Every interactive component implements a named WAI-ARIA Authoring Practices pattern, keyboard map included.">
      <h2>Patterns, not attributes</h2>
      <p>
        Each interactive component is built to a specific APG pattern rather than having ARIA
        sprinkled on afterwards: <code>Select</code> is an editable combobox,
        <code>MenuButton</code> is a menu button, <code>Tabbox</code> is a tab list,
        <code>Dialog</code> is a modal dialog on top of native <code>&lt;dialog&gt;</code>.
        The pattern brings its full keyboard map with it.
      </p>

      <h2>State lives in ARIA</h2>
      <p>
        Components express state through ARIA attributes and <code>data-state</code> — never
        through state classes — and style themselves from those same attributes
        (<code>[aria-expanded="true"]</code>, <code>[aria-selected="true"]</code>,
        <code>[data-state="open"]</code>). What a screen reader announces and what you see are
        driven by one source of truth.
      </p>

      <h2>Focus</h2>
      <p>
        Focus styling uses <code>:focus-visible</code> with the <code>--zx-focus-ring</code> token,
        so keyboard users get a ring and mouse users do not. Overlays trap focus with
        <code>focusTrap()</code> and restore it to the trigger on close. Roving tabindex and
        typeahead are available as helpers for custom widgets.
      </p>

      <h2>Motion</h2>
      <p>
        All non-essential animation sits behind
        <code>@media (prefers-reduced-motion: no-preference)</code>, and the base stylesheet
        collapses transitions entirely when a reduced-motion preference is set.
      </p>

      <h2>Contrast</h2>
      <p>
        Both stock themes are checked against WCAG AA for body text, muted text, status colours, and
        text on accent fills. If you define a product theme, re-check the accent pair —
        <code>--zx-color-accent</code> against <code>--zx-color-on-accent</code> — because that is
        the one that usually slips.
      </p>
