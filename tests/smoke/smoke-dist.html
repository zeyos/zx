<!doctype html>
<html lang="en" data-zx-theme="light" data-zx-density="cozy">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zx distribution smoke test</title>
  <link rel="stylesheet" href="../../dist/zx.css">
  <style>
    body { margin: 0; padding: var(--zx-space-6); color: var(--zx-color-text); background: var(--zx-color-bg-page); font-family: var(--zx-font-sans); }
    main { max-width: 48rem; margin-inline: auto; }
    #result { padding: var(--zx-space-4); border: 1px solid var(--zx-color-border); border-radius: var(--zx-radius-md); background: var(--zx-color-bg-surface); }
    #result[data-state="pass"] { color: var(--zx-color-success); border-color: var(--zx-color-success); }
    #result[data-state="fail"] { color: var(--zx-color-danger); border-color: var(--zx-color-danger); }
  </style>
</head>
<body>
  <main>
    <h1>Zx distribution smoke test</h1>
    <pre id="result" role="status" aria-live="polite">Running…</pre>
  </main>
  <script>
    window.__zxDistErrors = [];
    window.__zxDistSmoke = { passed: false, failed: 0, results: [] };
    window.addEventListener('error', function (event) {
      var text = event.error && event.error.message ? event.error.message : event.message;
      window.__zxDistErrors.push({ name: 'window error', passed: false, error: text });
      window.__zxDistSmoke = { passed: false, failed: window.__zxDistErrors.length, results: window.__zxDistErrors.slice() };
    }, true);
  </script>
  <script src="../../dist/zx.global.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', async function () {
      var results = window.__zxDistErrors.slice();
      function check(name, callback) {
        try {
          callback();
          results.push({ name: name, passed: true });
        } catch (error) {
          results.push({ name: name, passed: false, error: error && error.message ? error.message : String(error) });
        }
      }

      check('global API', function () {
        if (!window.zx || typeof window.zx.Toggle !== 'function') throw new Error('window.zx is missing');
      });

      var alertPromise;
      check('Dialog.alert opens', function () {
        alertPromise = window.zx.Dialog.alert({ title: 'Distribution', message: 'Global bundle is working.' });
        var dialog = document.querySelector('dialog.zx-dialog[open]');
        if (!dialog) throw new Error('Dialog.alert did not open');
        dialog.querySelector('[data-dialog-button]').click();
      });
      if (alertPromise) await alertPromise;

      check('compact DOM builder', function () {
        if (typeof window.zx.__ !== 'function') throw new Error('window.zx.__ is missing');
        var built = window.zx.__('button#built.primary', null, 'Built');
        if (built.id !== 'built' || built.textContent !== 'Built') throw new Error('window.zx.__ did not build DOM');
      });

      check('record primitives', function () {
        var names = ['EntityRef', 'FileItem', 'FileList', 'ActivityItem', 'ActivityList', 'CodeEditor'];
        names.forEach(function (name) {
          if (typeof window.zx[name] !== 'function') throw new Error('window.zx.' + name + ' is missing');
        });
        var components = [
          new window.zx.EntityRef(null, { title: 'Northwind', link: '#northwind', icon: 'folder' }),
          new window.zx.FileItem(null, { name: 'contract.pdf', status: 'uploading', progress: 20 }),
          new window.zx.FileList(null, { items: [{ id: 1, name: 'invoice.pdf' }] }),
          new window.zx.ActivityItem(null, { actor: 'Ada', title: 'created a record' }),
          new window.zx.ActivityList(null, { items: [{ id: 1, actor: 'Grace', title: 'added a note' }] }),
          new window.zx.CodeEditor(null, { value: '{"ready":true}', language: 'json' })
        ];
        components.forEach(function (component) { document.body.append(component.toElement()); });
        components[0].set({ title: 'Northwind Europe' });
        components[1].setProgress(75);
        components[2].addItem({ id: 2, name: 'scan.png' });
        components[3].setActivity({ title: 'updated a record' });
        components[4].appendItems({ id: 2, actor: 'Ada', title: 'reviewed the note' });
        if (!document.querySelector('.zx-file-item [role="progressbar"]')) {
          throw new Error('record primitive markup did not render');
        }
        components.forEach(function (component) { component.destroy(); });
        if (names.some(function (name) { return document.querySelector('.zx-' + name.replace(/[A-Z]/g, function (letter, index) {
          return (index ? '-' : '') + letter.toLowerCase();
        })); })) throw new Error('record primitive roots survived destroy');
      });

      var failed = results.filter(function (entry) { return !entry.passed; }).length;
      var passed = failed === 0;
      var output = document.getElementById('result');
      output.textContent = (passed ? 'PASS' : 'FAIL') + '\n' + results.map(function (entry) {
        return (entry.passed ? 'PASS ' : 'FAIL ') + entry.name + (entry.error ? ': ' + entry.error : '');
      }).join('\n');
      output.dataset.state = passed ? 'pass' : 'fail';
      window.__zxDistSmoke = { passed: passed, failed: failed, results: results };
    });
  </script>
</body>
</html>
