name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install devDependencies (esbuild, typescript, playwright-core)
        run: npm ci || npm install

      - name: Test (unit + design-token lint)
        run: npm test

      - name: Build distribution bundles
        run: npm run build

      # After the build: the distribution suite loads `dist/zx.global.js`. Chrome is preinstalled
      # on the GitHub runners, which is why this needs `playwright-core` and no browser download.
      - name: Smoke-test both suites in a real browser
        run: npm run test:browser

      - name: Build the documentation site
        run: npm run build:site

      - name: Smoke-test the built site
        run: node tools/check-site.js
