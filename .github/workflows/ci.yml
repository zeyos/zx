name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install devDependencies (esbuild only)
        run: npm ci || npm install

      - name: Test (unit + design-token lint)
        run: npm test

      - name: Build distribution bundles
        run: npm run build

      - name: Build the documentation site
        run: npm run build:site

      - name: Smoke-test the built site
        run: node tools/check-site.js
