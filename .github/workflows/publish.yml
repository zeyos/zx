name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Verify the package version matches the release tag
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          TAG="${TAG_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "release tag=$TAG  @zeyos/zx=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "Version mismatch: tag '$TAG' must equal the package version '$PKG'." >&2
            exit 1
          fi

      - name: Install devDependencies
        run: npm ci || npm install

      - name: Test (zero-dependency offline suite)
        run: npm test

      - name: Build distribution bundles
        run: npm run build

      # A pre-release must not become `latest`, or `npm i @zeyos/zx` hands everyone an alpha.
      # Any semver pre-release (`2.0.0-alpha.1`) publishes under `next`; a stable version
      # publishes under `latest`. Nothing to remember at release time.
      - name: Publish @zeyos/zx
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          case "$VERSION" in
            *-*) DIST_TAG=next ;;
            *) DIST_TAG=latest ;;
          esac
          echo "Publishing $VERSION under dist-tag $DIST_TAG"
          npm publish --access public --tag "$DIST_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
