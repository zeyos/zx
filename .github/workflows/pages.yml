name: Deploy documentation

# Manual-only until a host is chosen. `actions/configure-pages` fails unless Pages is enabled for
# the repository, so an automatic push trigger would mark every commit red while the site is
# hosted elsewhere. If you go with GitHub Pages: enable it (Settings → Pages → Source: GitHub
# Actions) and restore `push: branches: [main]` here. If you go with Netlify: delete this file.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a run finish rather than cancelling it: a half-deployed site is worse than a slightly
# stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install devDependencies (esbuild only)
        run: npm ci || npm install

      # The site serves the source modules directly, so `dist/` is not part of the artifact and
      # is not built here — ci.yml covers the bundles on the same push.
      - name: Test (unit + design-token lint)
        run: npm test

      - name: Assemble the site
        run: npm run build:site

      - name: Smoke-test the built site
        run: node tools/check-site.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
